<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exyt - Login</title>
    <link rel="stylesheet" href="../formulario/style.css">
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <img src="../assets/logo-fct.png" alt="Logo FCT" class="logo">
            <h1>Iniciar Sesión</h1>
        </div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" required>
                <span class="error-msg" id="error-email"></span>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required>
                <span class="error-msg" id="error-password"></span>
            </div>

            <div class="error-msg" id="error-global" style="text-align: center; margin-bottom: 10px;"></div>

            <button type="submit" class="btn-primary">Entrar</button>
            
            <div style="text-align: center; margin-top: 15px;">
                <button type="button" id="btn-google" class="btn-secondary" style="width: 100%;">Acceder con Google</button>
            </div>
            
            <div style="text-align: center; margin-top: 15px;">
                <a href="#" id="forgot-password" style="color: var(--color-secondary); font-size: 0.9rem;">¿Olvidaste tu contraseña?</a>
            </div>
        </form>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
